# Nginx configuration for General Store Management System
# Serves the React (Vite) build and proxies /api to the Node/Express backend.
#
# Usage:
#   1. Build the frontend: cd client && npm run build
#   2. Copy the contents of client/dist to /var/www/store-management/client/dist
#      (or update `root` below to point at your build output directory)
#   3. Run the backend separately (e.g. via pm2) on port 5000
#   4. Place this file at /etc/nginx/sites-available/store-management.conf
#      and symlink it into /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/store-management/client/dist;
    index index.html;

    # Gzip for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API requests to the Node/Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache hashed static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any route that isn't a real file or /api call
    # falls back to index.html so refreshing /dashboard, /products, etc. never 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
